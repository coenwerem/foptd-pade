[project]
name = "foptd-pade"
version = "0.1.0"
description = "Python reproduction of Enwerem & Okoro (2023) --- Pade-approximation-based PID tuning for FOPTD plants (arXiv:2210.08187)"
requires-python = ">=3.10"
dependencies = [
    "control>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foptd_pade*"]
